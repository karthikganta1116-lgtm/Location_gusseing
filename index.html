<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Location Guessing Game</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="game-container">

        <h1>🌍 Location Guessing Game</h1>

        <p>Can you identify the location using just 3 clues?</p>

        <div class="game-info">
            <h3>Score: <span id="score">0</span></h3>
            <h3>Question: <span id="question-number">1</span></h3>
        </div>

        <div class="clue-box">

            <h2>Find the Location</h2>

            <p id="clue">
                Click Start Game to receive your first clue!
            </p>

            <input
                type="text"
                id="answer"
                placeholder="Enter your answer"
            >

            <br><br>

            <button id="submit-btn" onclick="checkAnswer()">
                Submit Answer
            </button>

            <button id="next-clue-btn" onclick="showNextClue()">
                Next Clue
            </button>

            <p id="message"></p>

        </div>

        <button id="start-btn" onclick="startGame()">
            Start Game
        </button>

    </div>

    <script src="script.js"></script>

</body>

</html>
